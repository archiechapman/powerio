# Leg A: the distribution CIM corpus. fetch_corpus.sh downloads each feeder
# named here into tests/data/large/cim_dist/ (gitignored) and checks its
# SHA-256. The feeders are fetched, never vendored: the Powergrid-Models
# release branch has no licence file at its root.
#
# A feeder's expected findings live with the leg that checks it
# (census_expected.json, cimgraph_expected.json, schema_expected.json), so
# a behaviour change edits the expectations of the legs it affects.

[corpus.powergrid_models]
description = "GridAPPS-D Powergrid-Models releases/2024.06.0, platform/cimxml (CIM100, one document per feeder)"
repository = "https://github.com/GRIDAPPSD/Powergrid-Models"
# The releases/2024.06.0 branch head, pinned by commit.
commit = "2ec0ba442b4ef30206c71eab205758e18a77a564"
base_url = "https://raw.githubusercontent.com/GRIDAPPSD/Powergrid-Models/{commit}/platform/cimxml"

